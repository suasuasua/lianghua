<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>量化交易终端</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,Segoe UI,sans-serif;background:#0f172a;color:#e2e8f0;padding:20px;font-size:14px}
.container{max-width:1400px;margin:0 auto}
h1{font-size:22px;margin-bottom:4px}
h2{font-size:16px;margin:20px 0 10px;color:#94a3b8}
.sub{color:#64748b;font-size:13px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:#1e293b;border-radius:10px;border:1px solid #334155;padding:16px}
.card h3{font-size:14px;color:#94a3b8;margin-bottom:8px}
.val{font-size:28px;font-weight:700}
.val.green{color:#4ade80}
.val.red{color:#f87171}
.tag{display:inline-block;padding:2px 10px;border-radius:8px;font-size:12px;font-weight:600}
.tag-buy{background:#22c55e20;color:#4ade80}
.tag-sell{background:#ef444420;color:#f87171}
.tag-hold{background:#f59e0b20;color:#fbbf24}
.btn{display:inline-block;padding:10px 24px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;color:#fff}
.btn-green{background:#22c55e}
.btn-red{background:#ef4444}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 12px;color:#64748b;font-weight:500;border-bottom:1px solid #334155}
td{padding:8px 12px;border-bottom:1px solid #1e293b}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #1e293b;font-size:13px}
.row:last-child{border-bottom:none}
.bar{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.bar-item{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:12px 20px;flex:1;min-width:150px}
.bar-item .l{font-size:11px;color:#64748b}
.bar-item .v{font-size:22px;font-weight:700;margin-top:2px}
.blue{color:#3b82f6}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<h1>量化交易终端</h1>
<div class="sub">__TIME__ | 虚拟本金: 100,000 元 | <span id="live-badge" style="display:inline-block;padding:1px 8px;border-radius:4px;font-size:11px;font-weight:600;background:#22c55e20;color:#4ade80">LIVE</span> 价格s</div>
<div class="bar">
<div class="bar-item"><div class="l">总资产</div><div class="v __TOTAL_CLASS__">__TOTAL__</div></div>
<div class="bar-item"><div class="l">总盈亏</div><div class="v __PNL_CLASS__">__PNL__ (__PNL_PCT__%)</div></div>
<div class="bar-item"><div class="l">可用资金</div><div class="v">__CASH__</div></div>
<div class="bar-item"><div class="l">冻结(T+1)</div><div class="v">__PENDING__</div></div>
<div class="bar-item"><div class="l">持仓</div><div class="v">__POS_COUNT__</div></div>
<div class="bar-item"><div class="l">交易</div><div class="v">__TRADE_COUNT__</div></div>
<div class="bar-item"><div class="l">止损</div><div class="v" style="color:#f87171">__SL_COUNT__</div></div>
</div>
<div style="margin-bottom:8px;padding:10px 16px;background:#1e293b;border:1px solid #334155;border-radius:10px;font-size:13px;display:flex;align-items:center;gap:16px;flex-wrap:wrap">
<div><span id="sl-status" style="color:#4ade80">&#x25cf;</span> <span id="sl-message">正在启动...</span></div>
<div style="color:#64748b">Last: <span id="sl-last">Never</span></div>
<div style="color:#64748b">Next: <span id="sl-next">--</span></div>
</div><div style="margin-bottom:16px">
<form action="/auto_trade" method="post" style="display:inline"><button class="btn btn-green">执行自动交易</button></form>
<a href="/reset" class="btn" style="margin-left:8px;background:#475569">重置</a>
</div>
<h2>持仓</h2>
<div class="grid">__POSITIONS__</div>
<h2>信号</h2>
__SIGNALS__
<h2>交易记录</h2>
<table>
<tr><th>时间</th><th>方向</th><th>板块</th><th>代码</th><th>价格</th><th>数量</th><th>金额</th><th>PnL</th><th>原因</th></tr>
__TRADES__
</table>
<h2>净值曲线</h2>
<div id="chart" style="background:#1e293b;border-radius:10px;border:1px solid #334155;height:300px;margin-bottom:20px"></div>
</div>
<script>
// ===== Live P&L poll =====
function updateLivePnL() {
  fetch("/api/realtime_pnl").then(function(r){return r.json()}).then(function(d){
    var totalVal = d.total_value;
    var pnl = d.pnl;
    var pnlPct = d.pnl_pct;
    document.getElementById("live-badge").textContent = "LIVE (" + d.live_count + "/24)";
    // Update bar values
    var totalEl = document.querySelector(".bar-item:nth-child(1) .v");
    if (totalEl) {
      totalEl.textContent = totalVal.toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});
      totalEl.className = "v " + (totalVal >= 100000 ? "green" : "red");
    }
    var pnlEl = document.querySelector(".bar-item:nth-child(2) .v");
    if (pnlEl) {
      pnlEl.textContent = (pnl >= 0 ? "+" : "") + pnl.toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2}) + " (" + (pnlPct >= 0 ? "+" : "") + pnlPct.toFixed(2) + "%)";
      pnlEl.className = "v " + (pnl >= 0 ? "green" : "red");
    }
    // Update positions grid
    var posGrid = document.querySelector(".grid");
    if (posGrid && d.positions && d.positions.length > 0) {
      var newHtml = "";
      for (var i = 0; i < d.positions.length; i++) {
        var p = d.positions[i];
        var cls = p.pnl >= 0 ? "green" : "red";
        newHtml += "<div class=\"card\"><h3>" + p.sector + "</h3><div class=\"val " + cls + "\">" + (p.pnl >= 0 ? "+" : "") + p.pnl.toFixed(2) + "</div><div style=\"font-size:12px;color:#94a3b8\">" + p.pnl_pct + "%</div><div style=\"margin-top:8px;font-size:12px;color:#94a3b8\">成本: " + p.avg_cost + " | 现价: " + p.current_price + " | 持股: " + p.shares + "</div></div>";
      }
      posGrid.innerHTML = newHtml;
    }
    // Update cash
    var cashEl = document.querySelector(".bar-item:nth-child(3) .v");
    if (cashEl) cashEl.textContent = d.cash.toLocaleString("en-US");
  }).catch(function(){}); // ignore errors silently
}
setInterval(updateLivePnL, 15000);
updateLivePnL();

// ===== 净值曲线 Chart =====
fetch("/api/pnl_history").then(function(r){return r.json()}).then(function(d){
if(!d.data||d.data.length<2)return;
var c=echarts.init(document.getElementById("chart"));
c.setOption({
grid:{left:"5%",right:"5%",top:20,bottom:20},
xAxis:{type:"category",data:d.data.map(function(p){return p.date}),axisLabel:{fontSize:10,color:"#94a3b8"}},
yAxis:{type:"value",splitLine:{lineStyle:{color:"#1e293b"}},axisLabel:{fontSize:10,color:"#94a3b8"}},
series:[{name:"NAV",type:"line",data:d.data.map(function(p){return p.value}),smooth:true,showSymbol:false,lineStyle:{width:2,color:"#3b82f6"},areaStyle:{color:{type:"linear",x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:"#3b82f640"},{offset:1,color:"#3b82f605"}]}}}],
tooltip:{trigger:"axis"}});
window.addEventListener("resize",function(){c.resize()});});

// ===== Scheduler status poll =====
setInterval(function() {
  fetch("/api/status").then(function(r){return r.json()}).then(function(s){
    document.getElementById("sl-status").style.color = s.running ? "#4ade80" : "#fbbf24";
    document.getElementById("sl-message").textContent = s.message || "-";
    document.getElementById("sl-last").textContent = s.last_run || "Never";
    document.getElementById("sl-next").textContent = s.next_run || "--";
  });
}, 10000);
</script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</body>
</html>
